  --p-ord:#7398FF; --p-choque:#FF8A4C; --p-estab:#F2C94C; --p-deload:#5CC584;

  --good:#5CC584; --warn:#E0A84A; --bad:#FF7A7A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.005em;text-wrap:balance;margin:0}
h2{font-size:26px} h3{font-size:19px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1}
.brand span{color:var(--accent)}
.date{color:var(--muted);font-size:13px}
.weekstrip{display:flex;gap:6px;margin-top:10px}
.wchip{flex:1;min-width:0;border-radius:8px;padding:6px 4px 5px;background:var(--sunk);border:1px solid var(--line);font-size:11px;line-height:1.2;color:var(--muted);position:relative}
.wchip b{display:block;font-family:var(--display);font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wchip.now{background:var(--surface);border-color:var(--ink)}
.wchip .drop{position:absolute;top:4px;right:4px;width:7px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--period)}
.wchip .drop.pred{background:transparent;border:1.5px dashed var(--period)}
.plate{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;background:var(--p-ord)}
.t-ordinaria .plate,.plate.t-ordinaria{background:var(--p-ord)}
.t-choque .plate,.plate.t-choque{background:var(--p-choque)}
.t-estabilizadora .plate,.plate.t-estabilizadora{background:var(--p-estab)}
.t-deload .plate,.plate.t-deload{background:var(--p-deload)}
.t-reab .plate,.plate.t-reab{background:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.02em;border:1.5px solid currentColor;white-space:nowrap}
.pill.t-ordinaria{color:var(--p-ord)} .pill.t-choque{color:var(--p-choque)} .pill.t-estabilizadora{color:var(--p-estab)} .pill.t-deload{color:var(--p-deload)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:7px;font:600 13px var(--body);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button,.btn{font:600 14px var(--body);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.rose{background:var(--period);color:#fff;border-color:var(--period)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cal button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:62px}
.ex{padding:0;overflow:hidden}
.exhead .row{flex-wrap:nowrap}
.exhead{padding:12px 14px 8px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.15}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:3px}
.badge.pf{background:color-mix(in srgb,var(--p-choque) 16%,transparent);color:var(--p-choque)}
.badge.swap{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.presc{font-size:12px;color:var(--muted);margin-top:2px}
.target{margin:0 14px;padding:10px 12px;border-radius:10px;background:var(--sunk);display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.target .big{font-family:var(--display);font-size:23px;font-weight:700;line-height:1}
.target .why{grid-column:1/-1;font-size:12px;color:var(--muted)}
.tip{margin:8px 14px 0;padding:8px 10px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);font-size:13px;border-radius:0 8px 8px 0}
.tip .label{display:block;margin-bottom:2px}
.sets{width:100%;border-collapse:collapse;margin-top:10px}
.sets th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px}
.sets td{padding:4px 6px;border-top:1px solid var(--line)}
.sets td:first-child,.sets th:first-child{padding-left:14px;width:36px;color:var(--muted)}
.sets td:last-child,.sets th:last-child{padding-right:14px;width:52px;text-align:right}
.sets input{width:100%;text-align:center;padding:8px 4px}
.sets tr.done td{background:color-mix(in srgb,var(--good) 10%,transparent)}
.chk{width:40px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;line-height:1}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.exfoot{padding:8px 14px 12px;display:flex;flex-direction:column;gap:8px}
.alts{display:flex;flex-direction:column;gap:6px;padding:0 14px 10px}
.alts button{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:500}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{flex:1;max-width:112px;min-width:0;text-align:center;padding:9px 2px 8px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs a.on{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2}
.chart .ln2{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3;opacity:.6}
.chart .area{fill:var(--accent);opacity:.08}
.chart .pm{fill:var(--period);opacity:.75}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.kpi .v{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.1}
.status{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st-up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.st-flat{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.st-down{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}

.scroll{overflow-x:auto}

.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.wk{margin-top:6px}

.ring{width:96px;height:96px;flex:none}
.ring .bg{fill:none;stroke:var(--sunk);stroke-width:9}
.ring .fg{fill:none;stroke:var(--period);stroke-width:9;stroke-linecap:round}
.ring text{fill:var(--ink);font-family:var(--display);font-weight:700}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal{display:grid;grid-template-columns:16px repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600}

.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{border-color:var(--ink);font-weight:700}
.cal button.sel{box-shadow:0 0 0 2px var(--accent)}
.cal button.fl1{background:color-mix(in srgb,var(--period) 45%,transparent);color:#fff}
.cal button.fl2{background:color-mix(in srgb,var(--period) 75%,transparent);color:#fff}
.cal button.fl3{background:var(--period);color:#fff}
.cal button.proj{border:1.5px dashed var(--period);background:color-mix(in srgb,var(--period) 8%,transparent)}
.cal button.fert::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--fertile)}
.cal button.ovu{border-color:var(--fertile)}
.cal button.sym::before{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:6px 11px;font-weight:500;font-size:13px}
.chips button.on{background:var(--period);border-color:var(--period);color:#fff}
.chips.acc button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

/* ---------- ciclo menstrual ---------- */
// Only days she marks herself count. A start is a marked day with no marked day in the 10 days before it.
function cycDays(){return S.ciclo.days||{}}
function markedDays(){const d=cycDays();return Object.keys(d).filter(k=>d[k]&&d[k].flow).sort()}
function periodStarts(){const ds=markedDays();const out=[];let prev=null;for(const d of ds){if(!prev||diffDays(prev,d)>10)out.push(d);prev=d}return out}
function cycleLens(){const s=periodStarts();const L=[];for(let i=1;i<s.length;i++){const n=diffDays(s[i-1],s[i]);if(n>=15&&n<=60)L.push({from:s[i-1],n})}return L}
function cycleLen(){const L=cycleLens().slice(-6).map(x=>x.n);return L.length?Math.round(L.reduce((a,b)=>a+b,0)/L.length):(S.cfg.cycleLen||28)}
function effMon(start){const dow=parseD(start).getDay();if(S.cfg.weekendNext&&(dow===6||dow===0))return addDays(monday(start),7);return monday(start)}
function nextPredicted(){const s=periodStarts();if(!s.length)return null;return addDays(s[s.length-1],cycleLen())}
function weekInfo(dateStr,noOv){
  const m=monday(dateStr), ov=noOv?null:(S.cfg.weekOverrides||{})[m], curMon=monday(todayISO());
  const starts=periodStarts().map(s=>({s,eff:effMon(s)}));
  if(m>curMon&&starts.length){ // future weeks: add predicted starts (a late period is assumed to come this week)
    const L=cycleLen(); let p=addDays(starts[starts.length-1].s,L); if(p<todayISO()) p=todayISO();
    let guard=0; while(p<addDays(m,7)&&guard++<40){starts.push({s:p,eff:effMon(p),pred:true});p=addDays(p,L)}
  }
  const cand=starts.filter(x=>x.eff<=m);
  if(!cand.length) return {type:ov||'ordinaria',k:null,nodata:true,ov:!!ov};
  const st=cand[cand.length-1]; const k=Math.round((parseD(m)-parseD(st.eff))/6048e5);
  return {type:ov||(k<4?CYCLE[k]:'ordinaria'),k,start:st.s,pred:!!st.pred,late:k>=4,ov:!!ov};
}
const weekType=d=>weekInfo(d).type;
function weekLabel(info){ if(info.ov) return 'definida manualmente'; if(info.nodata) return 'marque a menstruação no Ciclo'; if(info.late) return 'aguardando a menstruação'; return 'semana '+(info.k+1)+' do ciclo'+(info.pred?' (previsto)':'') }
async function saveCiclo(){ try{await S.db.doc('ciclo/main').set(S.ciclo)}catch(e){toast('Não salvou: '+(e.code||e.message))} S._rev++; route() }
async function setFlow(day,flow){ const d={...cycDays()}; const cur={...(d[day]||{})}; if(flow){cur.flow=flow}else{delete cur.flow} if(!cur.flow&&!(cur.sym||[]).length&&!cur.note) delete d[day]; else d[day]=cur; const before=periodStarts().length; S.ciclo={...S.ciclo,days:d}; await saveCiclo(); const after=periodStarts(); if(flow&&after.length>before&&after[after.length-1]===day) toast('Novo ciclo: a semana de '+fmtD(effMon(day))+' vira Ordinária') }
async function toggleSym(day,sym){ const d={...cycDays()}; const cur={...(d[day]||{})}; const set=new Set(cur.sym||[]); set.has(sym)?set.delete(sym):set.add(sym); cur.sym=[...set]; if(!cur.flow&&!cur.sym.length&&!cur.note) delete d[day]; else d[day]=cur; S.ciclo={...S.ciclo,days:d}; await saveCiclo() }
function dayFlags(){ // projection of the current period (7 days from its first marked day) and the next predicted one
  const f={}, s=periodStarts(), d=cycDays(); if(!s.length) return f;
  const last=s[s.length-1];
  for(let i=0;i<7;i++){const k=addDays(last,i); if(!(d[k]&&d[k].flow)) f[k]='proj'}
  const L=cycleLen(); let n=addDays(last,L); if(n<todayISO()) n=todayISO();
  for(let c=0;c<3;c++){ for(let i=0;i<7;i++){const k=addDays(n,i); if(!(d[k]&&d[k].flow)) f[k]='proj'}
    if(S.cfg.showFertile){const ov=addDays(n,-14); for(let i=-5;i<=1;i++){const k=addDays(ov,i); if(!f[k]) f[k]=i===0?'ovu':'fert'}}
    n=addDays(n,L) }
  return f;
}

function allSessions(){

  return Object.values(m).sort((a,b)=>(b.date+(b.startedAt||'')).localeCompare(a.date+(a.startedAt||'')));
}
let _cache=null,_cacheKey='';
function sessionsCached(){const k=String(S._rev);if(k!==_cacheKey){_cache=allSessions();_cacheKey=k}return _cache}
function entriesFor(exId,gym){ // finished entries, newest first; gym=null means every gym
  const out=[];
  for(const s of sessionsCached()){ if(s.finished===false) continue;
    for(const e of s.exs||[]){ if(e.ex!==exId) continue; const g=e.gym||s.gym; if(gym&&g!==gym) continue;
      const sets=(e.sets||[]).filter(x=>x.kg!=null||x.r!=null); if(!sets.length) continue;
      out.push({date:s.date,wt:(S.cfg.weekOverrides||{})[monday(s.date)]||s.wt||weekType(s.date),gym:g,sets,note:e.note||'',sid:s.id,rehab:!!s.rehab}); } }
  return out;
}
function workSets(sets){ const loads=sets.filter(x=>x.kg!=null&&x.r!=null); if(!loads.length) return sets.filter(x=>x.r!=null);
  const top=Math.max(...loads.map(x=>x.kg)); return loads.filter(x=>x.kg===top); }
function rangeOf(item){const m=String(item?.reps||'8~10').match(/(\d+)\D+(\d+)/);if(m)return[+m[1],+m[2]];const n=parseInt(item?.reps);return n?[n,n]:[8,10]}
function secsOf(item){const n=parseInt(item?.reps);return n||30}
function stepFor(ex,u){ if(u==='placa') return 1; if(/halt|alt_giro|martelo|incl|goblet|afundo|bulgaro|sumo|remada_uni/.test(ex)) return 1; if(/barra|smith|agach_livre|rdl|elev_pelvica$|rosca_w|testa|curvada/.test(ex)) return 2; return 5 }
function unitFor(ex,gym){ const e=entriesFor(ex,gym)[0]; const u=e&&(e.sets.find(x=>x.u)||{}).u; return u&&u!=='s'?u:'kg' }
function computeTarget(item,gym,date,wtOverride,rehab){
  const ex=item.ex, wt=wtOverride||weekType(date), thisMon=monday(date);
  const [lo,hi]=rangeOf(item);
  const isRef=e=>['ordinaria','choque'].includes(e.wt);
  // progression only compares the same exercise at the same gym: each gym has its own scale
  const hist=entriesFor(ex,gym).filter(e=>monday(e.date)<thisMon||rehab);
  let last=hist[0]||null, ref=rehab?last:(hist.find(isRef)||last);
  let sets=item.sets||2;
  if(!rehab){ if(wt==='choque'&&item.pf) sets+=1; if(wt==='deload') sets=Math.max(1,sets-1); }
  const t={wt,sets,lo,hi,ref,last,kg:null,reps:[],unit:'kg',msg:'',rehab};
  const otherG=entriesFor(ex,null).find(e=>e.gym!==gym); t.otherHint=otherG?{gym:otherG.gym,date:otherG.date,txt:setsTxt(otherG.sets)}:null;
  if(isTimed(ex)){ t.timed=true; t.unit='s';
    const base=ref?ref.sets.map(x=>x.r).filter(x=>x!=null):[]; const at=i=>base.length?base[Math.min(i,base.length-1)]:secsOf(item);
    if(rehab||!ref){ t.reps=Array.from({length:sets},(_,i)=>at(i)); t.msg=ref?'Mantenha o tempo prescrito.':'Faça '+secsOf(item)+' s por série.'; return t }
    if(wt==='estabilizadora'||wt==='deload'){ t.reps=Array.from({length:sets},(_,i)=>at(i)); t.msg=wt==='deload'?'Mesmo tempo, 1 série a menos.':'Mesmo tempo da última vez.' }
    else { t.reps=Array.from({length:sets},(_,i)=>at(i)+5); t.msg='+5 segundos por série sobre a última '+TYPES[ref.wt].toLowerCase()+'.' }
    return t }
  if(!ref && item.base && item.base[gym]!=null){ ref=t.ref={date:null,wt:'ordinaria',gym,base:true,sets:Array.from({length:item.sets||3},()=>({kg:item.base[gym],r:lo}))} }
  if(!ref){ t.unit=unitFor(ex,gym); t.reps=Array(sets).fill(isBody(ex)?lo:null);
    t.msg=rehab?'Faça como prescrito: '+item.reps+' reps.':isBody(ex)?'Peso do corpo: faça '+lo+(hi>lo?'–'+hi:'')+' reps com RIR '+(item.rir??1)+'.':'Primeira vez na '+gymName(gym)+': escolha uma carga para '+lo+(hi>lo?'–'+hi:'')+' reps com RIR '+(item.rir??1)+' e anote.'; return t }
  const ws=workSets(ref.sets); t.kg=ws[0]?.kg??null; t.unit=(ref.sets.find(x=>x.u&&x.u!=='s')||{}).u||'kg';
  const rr=ws.map(x=>x.r); const at=i=>rr[Math.min(i,rr.length-1)]??lo;
  if(rehab){ t.reps=Array.from({length:sets},(_,i)=>at(i)); t.msg='Reabilitação: mantenha o que foi prescrito.'; return t }
  if(wt==='estabilizadora'||wt==='deload'){ t.reps=Array.from({length:sets},(_,i)=>Math.max(1,at(i)-2)); t.msg=wt==='deload'?'Mesmo peso, 2 reps a menos, 1 série a menos.':'Mesmo peso, 2 reps a menos.' }
  else{
    if(Math.min(...rr.slice(0,sets))>=hi && t.kg!=null && !ref.base){ t.kg=+(t.kg+stepFor(ex,t.unit)).toFixed(2); t.reps=Array(sets).fill(lo); t.msg='Bateu o topo da faixa ('+hi+'). Suba a carga e volte para '+lo+'.' }
    else { t.reps=Array.from({length:sets},(_,i)=>Math.min(hi+1,at(i)+1)); t.msg=ref.base?'Base da planilha (Treino 2 na C4). +1 rep por série.':'+1 rep por série sobre a última '+TYPES[ref.wt].toLowerCase()+'.' }
  }
  return t;
}
const setsTxt=sets=>{ if(sets.length&&sets.every(x=>x.u==='s')) return sets.map(x=>x.r==null?'?':f1(x.r)).join(' · ')+' s';
  const groups=[];sets.forEach(x=>{const k=x.kg==null?'PC':f1(x.kg)+'|'+(x.u||'kg');const g=groups[groups.length-1];if(g&&g.k===k)g.r.push(x.r);else groups.push({k,r:[x.r],kg:x.kg,u:x.u})});
  return groups.map(g=>fmtLoad(g.kg,g.u)+' × '+g.r.map(r=>r==null?'?':f1(r)).join(', ')).join(' · ')};

/* ---------- local storage (IndexedDB) ---------- */
const COLLS=['cfg','sessions','weights','cardio','ciclo'];
function LocalDB(){
  const mem={}; const subs=[]; let dbp=new Promise((res,rej)=>{const r=indexedDB.open('diario-thisbe',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  const ready=dbp.then(db=>new Promise(res=>{const tx=db.transaction('docs');const rq=tx.objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem[c.key]=c.value;c.continue()}else res()}}));
  const persist=(k,v)=>dbp.then(db=>new Promise((res,rej)=>{const tx=db.transaction('docs','readwrite');v===undefined?tx.objectStore('docs').delete(k):tx.objectStore('docs').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}));
  const snapDoc=p=>({id:p.split('/')[1],exists:mem[p]!==undefined,data:()=>mem[p]});
  const qs=c=>{const docs=Object.keys(mem).filter(k=>k.startsWith(c+'/')).map(k=>({id:k.slice(c.length+1),exists:true,data:()=>mem[k]}));return {docs}};
  const fire=c=>subs.forEach(([cc,f,isDoc])=>{ if(isDoc){ if(cc.startsWith(c+'/')) f(snapDoc(cc)) } else if(cc===c) f(qs(c)) });
  return {
    doc:p=>({set:async d=>{mem[p]=JSON.parse(JSON.stringify(d));await persist(p,mem[p]);fire(p.split('/')[0])},delete:async()=>{delete mem[p];await persist(p,undefined);fire(p.split('/')[0])},onSnapshot:f=>{subs.push([p,f,true]);ready.then(()=>f(snapDoc(p)))}}),
    collection:c=>({onSnapshot:f=>{subs.push([c,f,false]);ready.then(()=>f(qs(c)))}}),
    _putMany:async(obj)=>{await ready;for(const [k,v] of Object.entries(obj)){mem[k]=v;await persist(k,v)}COLLS.forEach(fire)}
  };
}

function resolvePick(id,persist){ if(!id.startsWith('new:')) return id; const name=id.slice(4).trim();

async function finishSession(){
  const d=S.draft; clearTimeout(saveTimer);

  const body={date:d.date,day:d.day||null,gym:d.gym,wt:d.wt,...(d.rehab?{rehab:true}:{}),startedAt:d.startedAt||null,endedAt:new Date().toTimeString().slice(0,5),finished:true,exs};
  const id=d.editOf||d.id;
  try{ await S.db.doc('sessions/'+id).set(body); if(d.editOf){try{await S.db.doc('sessions/'+d.id).delete()}catch(e){}} toast(d.editOf?'Treino atualizado':'Treino salvo'); S.draft=null;S.editing=false;S.sess[id]=body;S._rev++;location.hash=d.editOf?'#historico':'#hoje';route() }

}
async function discardSession(){ const d=S.draft; clearTimeout(saveTimer); S.draft=null;S.editing=false; if(!d.editOf){try{await S.db.doc('sessions/'+d.id).delete()}catch(e){}} route() }

/* ---------- Ciclo ---------- */
function viewCiclo(v){

    :`<div class="small">Toque nos dias do calendário em que você esteve menstruada (pode voltar aos meses anteriores). O app projeta 7 dias a partir do primeiro dia marcado e organiza a ondulação do treino pela sua menstruação.</div>`;
  if(!S.calM) S.calM=t.slice(0,7)+'-01';
  const mStart=S.calM, md=parseD(mStart), title=(t=>t.charAt(0).toUpperCase()+t.slice(1))(md.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  const gridStart=monday(mStart); let cells='<span></span>'+['S','T','Q','Q','S','S','D'].map(x=>`<span class="dow">${x}</span>`).join('');
  let day=gridStart; for(let w=0;w<6;w++){ if(w>0&&day.slice(0,7)!==mStart.slice(0,7)&&day>mStart) break;
    const wi=weekInfo(day); cells+=`<span class="wt t-${wi.type} ${wi.nodata&&!wi.ov?'none':''}" title="${TYPES[wi.type]}"></span>`;
    for(let i=0;i<7;i++){ const k=day, rec=d[k]||{}; const cls=[]; if(k.slice(0,7)!==mStart.slice(0,7)) cls.push('out'); if(k===t) cls.push('today'); if(k===S.calSel) cls.push('sel');
      if(rec.flow) cls.push('fl'+rec.flow); else if(flags[k]==='proj') cls.push('proj'); if(flags[k]==='fert') cls.push('fert'); if(flags[k]==='ovu') cls.push('ovu'); if((rec.sym||[]).length||rec.note) cls.push('sym');

const METRICS={e1rm:'1RM estimado',top:'Carga máxima',vol:'Volume (carga × reps)',reps:'Reps totais',bestReps:'Reps na carga máx.'};
const GROUPS={session:'Sessão',week:'Semana',cycle:'Ciclo'};
function exMetrics(e){const ok=e.sets.filter(x=>x.kg!=null&&x.r!=null);const top=ok.length?Math.max(...ok.map(x=>x.kg)):null;
  return {top,e1rm:ok.length?Math.max(...ok.map(x=>x.kg*(1+x.r/30))):null,vol:ok.reduce((a,x)=>a+x.kg*x.r,0),reps:e.sets.reduce((a,x)=>a+(x.r||0),0),bestReps:top==null?Math.max(0,...e.sets.map(x=>x.r||0)):Math.max(...ok.filter(x=>x.kg===top).map(x=>x.r))}}
function cycleKey(date){const s=periodStarts().filter(x=>effMon(x)<=monday(date));return s.length?s[s.length-1]:'0000-00-00'}
function groupKey(date,g){return g==='session'?date:g==='week'?monday(date):cycleKey(date)}
function series(exId,gym,metric,g){
  const es=entriesFor(exId,gym||null).reverse(); const buckets=new Map();
  for(const e of es){const k=groupKey(e.date,g);const m=exMetrics(e)[metric];if(m==null)continue;const b=buckets.get(k)||{k,date:e.date,vals:[],wt:e.wt};b.vals.push(m);buckets.set(k,b)}
  return [...buckets.values()].map(b=>({k:b.k,date:b.date,wt:b.wt,v:(metric==='vol'||metric==='reps')&&g!=='session'?b.vals.reduce((a,c)=>a+c,0):Math.max(...b.vals)}));
}
function lineChart(pts,opts={}){
  if(pts.length<1) return '<div class="empty">Sem dados para este filtro.</div>';
  const W=360,H=210,pl=36,pr=8,pt=10,pb=24; const vs=pts.map(p=>p.v); let lo=Math.min(...vs),hi=Math.max(...vs); if(lo===hi){lo-=1;hi+=1} const pad=(hi-lo)*.1;lo-=pad;hi+=pad;
  const x=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)); const y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g=''; for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${f1(Math.round(v*10)/10)}</text>`}
  const step=Math.max(1,Math.ceil(pts.length/4)); pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===pts.length-1&&pts.length>1?'end':i===0&&pts.length>1?'start':'middle'}">${esc(fmtD(p.date))}</text>`});
  if(opts.marks) pts.forEach((p,i)=>{if(opts.marks.has(p.date)) g+=`<rect class="pm" x="${x(i)-2.5}" y="${H-pb-5}" width="5" height="5" rx="1"><title>menstruação</title></rect>`});
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.v).toFixed(1)).join('');
  const area=path+`L${x(pts.length-1).toFixed(1)},${H-pb}L${x(0).toFixed(1)},${H-pb}Z`;
  let ln2=''; if(opts.avg){ln2=`<path class="ln2" d="${opts.avg.map((v,i)=>v==null?'':((i&&opts.avg[i-1]!=null?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1))).join('')}"/>`}
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4:2.6}" fill="${p.wt?`var(--p-${p.wt==='estabilizadora'?'estab':p.wt==='ordinaria'?'ord':p.wt})`:'var(--accent)'}" stroke="var(--surface)" stroke-width="1.5"><title>${fmtD(p.date)}: ${f1(p.v)}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'gráfico')}">${g}<path class="area" d="${area}"/><path class="ln" d="${path}"/>${ln2}${dots}</svg>`;
}
function exStatus(exId,gym){ const es=entriesFor(exId,gym); if(es.length<3) return null; const t=todayISO(); const c1=addDays(t,-28),c2=addDays(t,-56);
  const best=a=>a.length?Math.max(...a.map(e=>exMetrics(e).e1rm||0)):null;
  const a=best(es.filter(e=>e.date>=c1)), b=best(es.filter(e=>e.date<c1&&e.date>=c2)); if(a==null||b==null||!b) return null; return {gym,last:es[0],delta:(a-b)/b*100,a,b} }
function viewProg(v){

  const first=pts[0],last=pts[pts.length-1],best=pts.length?Math.max(...pts.map(p=>p.v)):null;
  const statuses=[]; exList.forEach(id=>gyms().forEach(g=>{const s=exStatus(id,g.id); if(s&&s.last.date>=addDays(todayISO(),-28)) statuses.push({id,s})})); statuses.sort((a,b)=>a.s.delta-b.s.delta);
  let h=`<div class="stack"><h2>Progresso</h2>
  <div class="card stack"><div><div class="label">Exercício</div><select id="pex" style="width:100%;margin-top:6px">${exList.map(id=>`<option value="${id}" ${id===st.ex?'selected':''}>${esc(exName(id))} (${used[id]})</option>`).join('')}</select></div>
  <div><div class="label">Academia</div><div class="seg" style="margin-top:6px">${gymsFor.map(g=>`<button data-pg="${g}" class="${st.gym===g?'on':''}">${esc(gymName(g))} (${gc[g]})</button>`).join('')}</div><div class="tiny muted" style="margin-top:4px">Cada academia tem sua escala, então o gráfico mostra uma de cada vez.</div></div>
  <div class="seg">${Object.entries(METRICS).map(([k,n])=>`<button data-pm="${k}" class="${st.metric===k?'on':''}">${n}</button>`).join('')}</div>
  <div class="seg">${Object.entries(GROUPS).map(([k,n])=>`<button data-pgr="${k}" class="${st.group===k?'on':''}">${n}</button>`).join('')}</div>
  ${pts.length?`<div class="kpis"><div class="kpi"><div class="label">Atual</div><div class="v">${f1(Math.round(last.v*10)/10)}</div><div class="tiny muted">${fmtD(last.date)}</div></div><div class="kpi"><div class="label">Melhor</div><div class="v">${f1(Math.round(best*10)/10)}</div></div><div class="kpi"><div class="label">Desde o início</div><div class="v" style="color:${last.v>=first.v?'var(--good)':'var(--bad)'}">${first.v?(last.v>=first.v?'+':'')+f1(Math.round((last.v-first.v)/first.v*1000)/10)+'%':'–'}</div></div></div>`:''}
  ${lineChart(pts,{aria:METRICS[st.metric]+' de '+exName(st.ex)})}

  <div class="card"><h3>Onde estou evoluindo e onde estagnei</h3><div class="small muted" style="margin-bottom:6px">1RM estimado das últimas 4 semanas contra as 4 anteriores, em cada academia.</div>
  <div class="list">${statuses.length?statuses.map(x=>{const d=x.s.delta;const cls=d>1.5?'st-up':d<-1.5?'st-down':'st-flat';const lab=d>1.5?'Evoluindo':d<-1.5?'Caindo':'Estagnado';return `<div class="li"><div style="min-width:0"><b>${esc(exName(x.id))}</b><div class="tiny muted">${esc(gymName(x.s.gym))} · ${f1(Math.round(x.s.b))} → ${f1(Math.round(x.s.a))}</div></div><span class="status ${cls}">${lab} ${d>0?'+':''}${f1(Math.round(d*10)/10)}%</span></div>`}).join(''):'<div class="empty">Ainda não há 8 semanas de dados para comparar.</div>'}</div></div></div>`;
  v.innerHTML=h;
  $('#pex').onchange=e=>{st.ex=e.target.value;st.gym='';route()};
  v.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{st.gym=b.dataset.pg;route()});

  v.querySelectorAll('[data-pgr]').forEach(b=>b.onclick=()=>{st.group=b.dataset.pgr;route()});
}

async function importBackup(j){
  if(!j||j.app!=='diario-thisbe') throw new Error('não é um backup do Diário fitness da Thisbe');
  const put={};
  if(j.cfg&&Object.keys(j.cfg).length) put['cfg/main']={...S.cfg,...j.cfg};
  for(const s of (j.sessions||[])){ if(!s||!s.date||s.finished===false) continue; const {id,...body}=s; put['sessions/'+id]={...body,finished:true} }
  const wm={};
  for(const [day,arr] of Object.entries(j.weights||{})){ const k='w-'+day.slice(0,7); const doc=wm[k]=wm[k]||JSON.parse(JSON.stringify(S.wdocs[k]||{month:day.slice(0,7),days:{}})); const have=new Set((doc.days[day]||[]).map(x=>x.t+'|'+x.kg)); doc.days[day]=(doc.days[day]||[]).concat(arr.filter(x=>!have.has(x.t+'|'+x.kg))) }
  Object.entries(wm).forEach(([k,v])=>put['weights/'+k]=v);
  (j.cardio||[]).forEach(c=>{if(c&&c.id&&c.date){const {id,...b}=c;put['cardio/'+id]=b}});
  if(j.ciclo&&j.ciclo.days) put['ciclo/main']={...S.ciclo,days:{...(S.ciclo.days||{}),...j.ciclo.days}};
  await S.db._putMany(put); S._rev++; route();
  return (j.sessions||[]).length;
}

  v.querySelectorAll('[data-ps]').forEach(i=>i.oninput=()=>PR[sd].items[+i.dataset.ps].sets=parseInt(i.value)||1);
  v.querySelectorAll('[data-pr]').forEach(i=>i.oninput=()=>PR[sd].items[+i.dataset.pr].reps=i.value);
  v.querySelectorAll('[data-ppf]').forEach(i=>i.onchange=()=>PR[sd].items[+i.dataset.ppf].pf=i.checked);
  v.querySelectorAll('[data-pup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pup;if(i>0){const a=PR[sd].items;[a[i-1],a[i]]=[a[i],a[i-1]];saveCfg({program:PR})}});
  v.querySelectorAll('[data-prm]').forEach(b=>b.onclick=()=>{PR[sd].items.splice(+b.dataset.prm,1);saveCfg({program:PR})});
  $('#paddbtn').onclick=()=>{S.paddOpen=!S.paddOpen;route()};
  const pq=$('#pickq'); if(pq){pq.oninput=()=>{S.pickQ=pq.value;const pos=pq.selectionStart;route();const n=$('#pickq');n.focus();n.setSelectionRange(pos,pos)}}
  v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const id=resolvePick(b.dataset.pick,false);PR[sd].items.push({ex:id,sets:3,reps:isTimed(id)?'30s':'8~10',pf:false});S.paddOpen=false;S.pickQ='';saveCfg({program:PR})});
  $('#saveprog').onclick=()=>saveCfg({program:PR});
  $('#pdname').onchange=e=>{PR[sd].name=e.target.value.trim()||sd;saveCfg({program:PR})};
  $('#pdrehab').onchange=e=>{PR[sd].rehab=e.target.checked;saveCfg({program:PR})};
  $('#pddow').onchange=e=>{const val=e.target.value;if(val==='')delete PR[sd].dow;else PR[sd].dow=+val;saveCfg({program:PR})};
  $('#newday').onclick=()=>{let c='G';const ks=Object.keys(PR);for(const L of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){if(!ks.includes(L)){c=L;break}}PR[c]={name:c+' · Treino '+c,items:[]};S.setDay=c;saveCfg({program:PR})};
  const dd=$('#delday'); dd.onclick=()=>{ if(Object.keys(PR).length<=1){toast('Precisa ter pelo menos um treino');return} if(!dd.dataset.armed){dd.dataset.armed=1;dd.textContent='Toque de novo para excluir';return} delete PR[sd];S.setDay=null;saveCfg({program:PR}) };
  const rp=$('#resetprog'); rp.onclick=()=>{ if(!rp.dataset.armed){rp.dataset.armed=1;rp.textContent='Toque de novo: o programa volta ao original (o histórico fica)';return} const c={...S.cfg};delete c.program;S.cfg=c;S.setDay=null;saveCfg({}) };
  if(S.focusProg){S.focusProg=false;setTimeout(()=>{const c=$('#progcard');c&&c.scrollIntoView({block:'start'})},50)}
  $('#export').onclick=doExport;
  $('#import').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); const n=await importBackup(j); toast(n+' treinos importados'); }catch(err){ toast('Arquivo inválido: '+err.message) } e.target.value=''; };
}

boot();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}))}
async function checkUpdate(){ try{ const r=await fetch('version.json?'+Date.now(),{cache:'no-store'}); const j=await r.json();
  if(j.v&&j.v!==APP_VERSION){ const reg=await navigator.serviceWorker?.getRegistration(); if(reg) await reg.update().catch(()=>{});
    const k='reloadedFor';try{if(sessionStorage.getItem(k)===j.v)return;sessionStorage.setItem(k,j.v)}catch(e){} if(S.editing&&S.draft){ await saveDraftNow() } location.reload() } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate() });
setTimeout(checkUpdate,1500);
window.__thisbe={S,weekInfo,periodStarts,computeTarget,setFlow};
})();
</script>
</body></html>
